name: Test

on:
  workflow_dispatch:
  release:
    types:
      - published
  pull_request:
    branches:
      - master
      - v[0-9]+.[0-9]+-dev

jobs:
  test:
    name: Run Dashd RPC tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Enable NPM cache
        uses: actions/cache@v6
        with:
          path: '~/.npm'
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install NPM dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Run coverage tests
        run: npm run coverage

  release:
    name: Release NPM package
    runs-on: ubuntu-latest
    needs: test
    if: ${{ github.event_name == 'release' }}
    # npm trusted publishing exchanges the job's OIDC token for a publish
    # token, so no npm secret is needed.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # Node 24 ships npm 11, which supports trusted publishing.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Check package version matches tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Release tag $TAG does not match package version v$VERSION"
            exit 1
          fi

      - name: Enable NPM cache
        uses: actions/cache@v6
        with:
          path: '~/.npm'
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install NPM dependencies
        run: npm ci

      - name: Set release tag
        uses: actions/github-script@v9
        id: tag
        with:
          result-encoding: string
          script: |
            const tag = context.payload.release.tag_name;
            const [, major, minor] = tag.match(/^v([0-9]+)\.([0-9]+)/);
            return (tag.includes('dev') ? `${major}.${minor}-dev` : 'latest');

      - name: Publish NPM package
        env:
          NPM_TAG: ${{ steps.tag.outputs.result }}
        run: npm publish --access public --tag "$NPM_TAG"
